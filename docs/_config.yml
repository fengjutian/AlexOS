title: Alex Runtime
description: AI Application Runtime documentation
theme: just-the-docs
remote_theme: just-the-docs/just-the-docs@v0.10.1
color_scheme: light
logo: "/assets/images/alex-runtime-wordmark.svg"
favicon_ico: "/assets/images/favicon.svg"

# We don't want Jekyll to drop files starting with `_` (we have nothing in
# docs/ that needs excluding), but we do want to skip the moved-aside file
# from status-and-roadmap so the sidebar stays clean.
exclude:
  - status-and-roadmap.md.moved-2026-08-22

permalink: /:title
url: "https://fengjutian.github.io"
baseurl: "/AlexOS"

aux_links:
  "GitHub":
    - "https://github.com/fengjutian/AlexOS"
aux_links_new_tab: true

nav_external_links:
  - title: GitHub Repository
    url: https://github.com/fengjutian/AlexOS
    hide_icon: false

heading_anchors: true
nav_sort: case_insensitive
nav_fold: true
back_to_top: true
back_to_top_text: "返回顶部"
footer_content: "Alex Runtime · Experimental AI Application Runtime · MIT License"
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d"

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: purple
