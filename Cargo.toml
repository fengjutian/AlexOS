[package]
name = "alex"
version = "0.1.0"
edition = "2024"
description = "Alex OS desktop application runtime prototype"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
semver = { version = "1.0.28", features = ["serde"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tempfile = "3.27.0"
url = "2.5.8"
ureq = "3.4.0"
zip = { version = "4.6.1", default-features = false }
notify = "6.1.1"
ignore = "0.4.20"

[dev-dependencies]
serial_test = "3.0"

[target.'cfg(windows)'.dependencies]
arboard = "3.6.1"
open = "5.3.6"
rfd = { version = "0.16.0", default-features = false }
tao = "0.35.3"
wry = "0.55.1"
muda = { version = "0.19.3", default-features = false }
tray-icon = { version = "0.24.1", default-features = false }
global-hotkey = "0.8.0"
windows = { version = "0.61.3", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6.1"
open = "5.3.6"
rfd = { version = "0.16.0", default-features = false }
security-framework = "3.5.1"

[dependencies.base64]
version = "0.22.1"

[dependencies.ed25519-dalek]
version = "2.2.0"
features = ["rand_core"]

[dependencies.rand_core]
version = "0.6.4"
features = ["getrandom"]
