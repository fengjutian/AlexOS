name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  dependency-review:
    name: Supply chain · dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  supply-chain:
    name: Supply chain · audit + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-cyclonedx
      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings
      - name: Generate CycloneDX SBOM from Cargo.lock
        run: cargo cyclonedx --all-features --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: alex-cyclonedx-sbom
          path: |
            **/*.cdx.json
          if-no-files-found: error

  linux-check:
    name: Linux · fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install Node.js (for SDK tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Linux build
        run: cargo build --offline
      - name: Linux tests
        run: cargo test --offline
      - name: SDK tests
        run: node --test packages/sdk/test/sdk.test.mjs
      - name: SDK schema is generated
        run: node packages/sdk/generate-schema.mjs --check
      - name: Documentation links and facts
        run: node scripts/check-docs.mjs

  windows-build:
    name: Windows · build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install Node.js (for SDK tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Windows build
        run: cargo build --offline
      - name: Windows tests
        run: cargo test --offline
      - name: SDK tests
        run: node --test packages/sdk/test/sdk.test.mjs
      - name: SDK schema is generated
        run: node packages/sdk/generate-schema.mjs --check
      - name: Documentation links and facts
        run: node scripts/check-docs.mjs
      - name: Smoke · manager subcommand help
        # Validates that the CLI surface builds and prints help on Windows;
        # the actual WebView is not started (it would block the runner).
        run: cargo run --offline -- manager --help
      - name: Build Windows Developer Preview package
        shell: pwsh
        run: ./scripts/build-windows-package.ps1
      - name: Install WiX Toolset
        run: dotnet tool install --global wix
      - name: Build unsigned Windows MSI
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -SkipBuild
      - name: Upload Windows Developer Preview
        uses: actions/upload-artifact@v4
        with:
          name: alex-windows-developer-preview
          path: |
            target/release-package/*.zip
            target/release-installer/*.msi
            target/release-installer/installer-checksums.txt
          if-no-files-found: error

  windows-node-matrix:
    name: Windows · Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.node-version }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Windows tests (multi Node matrix)
        run: cargo test --offline

  windows-cross-user:
    name: Windows · cross-user pipe rejection
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-user-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build alex.exe
        run: cargo build --offline
      - name: Cross-user daemon rejection acceptance
        shell: pwsh
        run: ./scripts/ci-cross-user.ps1 -BinDir ./target/debug
