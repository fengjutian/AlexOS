<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Alex Service Hello</title>
  </head>
  <body>
    <main>
      <h1>Alex Service Hello</h1>
      <p id="status">Click "Call Service" to round-trip a request through the <code>alex://app/api/*</code> reverse proxy.</p>
      <button id="call">Call Service</button>
      <pre id="output" hidden></pre>
      <button id="rename">Rename Window</button>
      <button id="notify">Show Notification</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
