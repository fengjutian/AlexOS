schemaVersion: 2
id: com.alex.coding-agent
name: Alex Coding Agent
version: 0.1.0

frontend:
  entry: frontend/dist/index.html
  dev:
    command: npm
    args: [run, dev, "--", "--host", "127.0.0.1", "--port", "5173", "--strictPort"]
    install:
      command: npm
      args: [install]
    cwd: frontend
    url: http://127.0.0.1:5173

runtime:
  node: "22"

services:
  app:
    runtime: node
    command: app/dist/service.js
    dev:
      command: npm
      args: [run, dev]
      install:
        command: npm
        args: [install]
      cwd: app
    restart:
      policy: on-failure
      maxRetries: 3
    env:
      ALEX_WORKSPACE: workspace
      LOG_LEVEL: info

mcpServers:
  filesystem:
    transport: stdio
    command: mcp/dist/filesystem.js

agent:
  model: remote/ollama/qwen3
  systemPrompt: >-
    You are a coding assistant. Inspect files before editing, keep changes scoped,
    and explain the result. Never access paths outside the granted workspace.
  tools:
    - binding: filesystem
      name: read_text_file
      idempotent: true
    - binding: filesystem
      name: list_directory
      idempotent: true
    - binding: filesystem
      name: write_text_file
      requireApproval: true
  budget:
    maxSteps: 24
    maxTokens: 16384
    maxToolCalls: 16
    maxWallTimeMs: 300000

storage:
  - name: workspace
    path: workspace

permissions:
  filesystem:
    read:
      - workspace
    write:
      - workspace
  network:
    allow:
      - localhost
  shell:
    allow: []
