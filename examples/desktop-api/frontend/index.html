<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Desktop API Demo</title><link rel="stylesheet" href="app.css"></head>
<body><main><h1>Alex OS Desktop API Demo</h1><p id="status">正在连接 Host…</p><section><h2>系统与路径</h2><button data-action="info">读取系统信息</button><button data-action="paths">读取应用路径</button><pre id="output"></pre></section><section><h2>存储与文件</h2><input id="text" value="Hello from Alex OS"><button data-action="store">保存设置</button><button data-action="write">写入 data/demo.txt</button><button data-action="read">读取文件</button><button data-action="watch">监听 data</button></section><section><h2>桌面交互</h2><button data-action="open">选择文件</button><button data-action="save">保存文件</button><button data-action="copy">复制文本</button><button data-action="paste">读取剪贴板</button><button data-action="notify">发送通知</button><button data-action="title">修改标题</button><button data-action="child">创建子窗口</button><button data-action="external">打开 example.com</button><p>也可以把文件拖到此窗口，结果会显示在下方。</p></section><section><h2>事件日志</h2><pre id="events"></pre></section></main><script src="app.js"></script></body></html>
